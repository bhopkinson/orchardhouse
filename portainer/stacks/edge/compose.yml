services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      INFO: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - orchard_socket

  traefik:
    image: traefik:v3.7.0
    restart: unless-stopped
    depends_on:
      - socket-proxy
    command:
      - --log.level=INFO
      - --accesslog=true
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=orchard_proxy
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    networks:
      - orchard_proxy
      - orchard_socket
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.routers.traefik.entrypoints=web
      - traefik.http.routers.traefik.service=api@internal

  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - --credentials-file
      - /etc/cloudflared/credentials.json
      - run
      - ${CLOUDFLARE_TUNNEL_ID}
    configs:
      - source: cloudflared_config
        target: /etc/cloudflared/config.yml
    volumes:
      - /srv/orchardhouse/cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    networks:
      - orchard_proxy

  whoami:
    image: traefik/whoami:v1.11.0
    restart: unless-stopped
    networks:
      - orchard_proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=Host(`whoami.${DOMAIN}`)
      - traefik.http.routers.whoami.entrypoints=web
      - traefik.http.services.whoami.loadbalancer.server.port=80

networks:
  orchard_proxy:
    name: orchard_proxy
  orchard_socket:
    name: orchard_socket

configs:
  cloudflared_config:
    content: |
      ingress:
        - service: http://traefik:80
