name: portainer-stacks-mcp-proxy

on:
  push:
    branches: ["main"]
    paths:
      - "portainer/stacks/mcp-proxy/**"
      - ".github/workflows/portainer-stacks-mcp-proxy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose --env-file portainer/stacks/mcp-proxy/.env.example -f portainer/stacks/mcp-proxy/compose.yml config >/dev/null

      - name: Trigger Portainer redeploy
        env:
          PORTAINER_STACK_MCP_PROXY_WEBHOOK: ${{ secrets.PORTAINER_STACK_MCP_PROXY_WEBHOOK }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          curl --fail --show-error --silent \
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --request POST \
            "$PORTAINER_STACK_MCP_PROXY_WEBHOOK"
